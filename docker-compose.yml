services:
  skillshield-web:
    build: .
    container_name: skillshield-web
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=file:/app/data/skillshield.db
      - REDIS_URL=redis://redis:6379
      - NODE_ENV=production
    volumes:
      - skillshield_data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - skillshield-net
    depends_on:
      redis:
        condition: service_healthy

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - skillshield-net

volumes:
  skillshield_data:
    name: skillshield_data

networks:
  skillshield-net:
    name: skillshield-network
    driver: bridge
