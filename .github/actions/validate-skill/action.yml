name: 'AI Skill Shield Validate'
description: 'Scan agent skills with the shared AI Skill Shield security engine'
author: 'AI Skill Shield'

inputs:
  skill-path:
    description: 'Path to the skill directory containing SKILL.md'
    required: true
  fail-on:
    description: 'Minimum severity to fail the check (critical, high, medium, low, info)'
    required: false
    default: 'high'
  output-format:
    description: 'Report output format (json, html, markdown, sarif)'
    required: false
    default: 'json'
  fail-on-incomplete:
    description: 'Fail when files were excluded or unreadable'
    default: 'true'
  baseline:
    description: 'Optional accepted baseline JSON path relative to the workspace'
  dependencies:
    description: 'Opt in to live OSV checks for exact dependency versions'
    default: 'false'

outputs:
  score:
    description: 'Shared security scan score (0-100)'
  risk-level:
    description: 'Highest finding severity (safe, info, low, medium, high, critical)'
  finding-count:
    description: 'Total number of findings'
  active-finding-count:
    description: 'Findings not accepted by a matching baseline'
  coverage:
    description: 'Local inspection coverage: complete or partial'
  verdict:
    description: 'Do Not Install, Needs Manual Review or Safe to Review based on active findings and coverage'

runs:
  using: 'node20'
  main: 'index.js'
